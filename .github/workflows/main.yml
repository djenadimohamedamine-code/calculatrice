name: Build Calculatrice (Android APK & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Backup Custom Manifest
        run: |
          cp android/app/src/main/AndroidManifest.xml AndroidManifest.xml.bak

      - name: Create Native Android Project
        run: |
          rm -rf android
          flutter create --project-name=calculatrice --platforms=android .

      - name: Restore Custom Manifest
        run: |
          cp AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml

      - name: Configure compileSdk and minSdk
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"

      - name: Backup Custom Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          cp -r ios/Runner/Info.plist ios_Info.plist.bak
          cp -r ios/Runner/AppDelegate.swift ios_AppDelegate.swift.bak

      - name: Create Project Files
        run: flutter create --project-name=calculatrice --platforms=ios .

      - name: Restore Custom Files
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          cp -r lib.bak/. lib/
          cp ios_Info.plist.bak ios/Runner/Info.plist
          cp ios_AppDelegate.swift.bak ios/Runner/AppDelegate.swift

      - name: Get Dependencies
        run: |
          flutter config --enable-ios
          flutter clean
          flutter pub get

      - name: Pods
        run: |
          cd ios
          for i in 1 2 3; do
            echo "Tentative $i pour pod install..."
            pod install --repo-update && break || sleep 15
          done

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --verbose \
            --dart-define=FLUTTER_XCODE_SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r calculatrice.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-ipa
          path: build/ios/iphoneos/calculatrice.ipa
