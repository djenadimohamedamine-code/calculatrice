name: Build Calculatrice (Android APK & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.24.3 (Exact iOS Version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Native Android Folder on Cloud
        run: |
          rm -rf android
          flutter create --org com.mimo --project-name=calculatrice --platforms=android .
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Upgrade Kotlin Version & Gradle Configuration
        run: |
          sed -i '1i buildscript { ext.kotlin_version = "1.9.22" }' android/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle || true

      - name: Add Android Manifest
        run: |
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK (Android)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"

      - name: Backup Custom Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          cp -r ios/Runner/Info.plist ios_Info.plist.bak
          cp -r ios/Runner/AppDelegate.swift ios_AppDelegate.swift.bak

      - name: Create Project Files
        run: flutter create --project-name=calculatrice --platforms=ios .

      - name: Restore Custom Files
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          cp -r lib.bak/. lib/
          cp ios_Info.plist.bak ios/Runner/Info.plist
          cp ios_AppDelegate.swift.bak ios/Runner/AppDelegate.swift

      - name: Get Dependencies
        run: |
          flutter config --enable-ios
          flutter clean
          flutter pub get

      - name: Pods
        run: |
          cd ios
          for i in 1 2 3; do
            echo "Tentative $i pour pod install..."
            pod install --repo-update && break || sleep 15
          done

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --verbose \
            --dart-define=FLUTTER_XCODE_SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r calculatrice.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-ipa
          path: build/ios/iphoneos/calculatrice.ipa
